name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"

jobs:
  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run shellcheck
        run: |
          # -S warning: SC1091 "not following" notes on $SCRIPT_DIR-based
          # sources are info-level and not actionable in CI.
          shellcheck -S warning -x \
            rcc \
            install.sh \
            lib/core/common.sh \
            lib/core/commands.sh \
            lib/core/report.sh \
            lib/audit/checks.sh \
            bin/*.sh \
            completions/bash/rcc

  go-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Build Go UI
        run: cd ui && go build -o /dev/null ./...

  # The overlap tests build their own fake filesystem, so they are the one
  # suite that is meaningful on Linux too — it catches GNU-vs-BSD drift in the
  # tools overlap.sh leans on (readlink, awk) before macOS-only CI hides it.
  bats-portable:
    needs: shellcheck
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: npm install -g bats
      - name: Run portable tests
        run: bats tests/test_overlap.bats

  bats:
    needs: shellcheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        # test_helper.bash ships its own assert_* helpers; only bats-core is
        # needed (bats-assert/bats-support are not homebrew-core formulae).
        run: brew install bats-core
      - name: Run bats tests
        run: bats tests/
