name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.23"

jobs:
  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run shellcheck
        run: |
          # -S warning: SC1091 "not following" notes on $SCRIPT_DIR-based
          # sources are info-level and not actionable in CI.
          shellcheck -S warning -x \
            rcc \
            install.sh \
            lib/core/common.sh \
            lib/core/commands.sh \
            lib/core/report.sh \
            lib/audit/checks.sh \
            bin/*.sh \
            completions/bash/rcc

  go-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
      - name: Build Go UI
        run: cd ui && go build -o /dev/null ./...
      - name: Test Go UI
        run: cd ui && go test ./...

  # The overlap tests build their own fake filesystem, so they are the one
  # suite that is meaningful on Linux too - it catches GNU-vs-BSD drift in the
  # tools overlap.sh leans on (readlink, awk) before macOS-only CI hides it.
  bats-portable:
    needs: shellcheck
    strategy:
      # The point of this job is comparing the two platforms, so one failing
      # must not cancel the other and hide half the answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        # Cloned rather than installed: a global npm install needs sudo on the
        # Linux runner and brew is macOS-only, so this is the one form that is
        # identical on both - and pins both platforms to the same bats.
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats"
          echo "$RUNNER_TEMP/bats/bin" >> "$GITHUB_PATH"
      - name: Run portable tests
        run: bats tests/test_overlap.bats

  bats:
    needs: shellcheck
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        # test_helper.bash ships its own assert_* helpers; only bats-core is
        # needed (bats-assert/bats-support are not homebrew-core formulae).
        run: brew install bats-core
      - name: Run bats tests
        run: bats tests/
