name: Release

on:
  push:
    tags: ["v*"]
  # Answer "can this token still push to the tap?" on demand, instead of
  # finding out from a release that has already published its tag.
  workflow_dispatch:

env:
  # One tap for every CLI. rcc had its own, and a tap nobody bumps quietly
  # serves an old version - canary sat on v0.7.0 for months that way.
  # homebrew-raccoon redirects here via tap_migrations.json.
  TAP_REPO: thousandflowers/homebrew-tap
  FORMULA_PATH: Formula/rcc.rb
  # `softwareupdate -l` needs over seven minutes on a fresh runner and
  # answers a question about a machine that will not exist in ten. It was
  # 14m43s of a 16m49s run, paid twice per release. The check reports
  # "Not checked" when this is set — never "Up to date".
  RCC_SKIP_SOFTWARE_UPDATE: "1"

jobs:
  ci:
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run shellcheck
        run: |
          shellcheck -S warning -x \
            rcc install.sh \
            lib/core/common.sh lib/core/commands.sh \
            lib/audit/checks.sh \
            bin/*.sh completions/bash/rcc
      - name: Install bats
        run: brew install bats-core
      - name: Run bats tests
        run: bats tests/

  release:
    if: github.event_name == 'push'
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod

      - name: Build universal Go TUI binary
        run: |
          cd ui
          GOARCH=arm64 go build -o rcc-ui-arm64 main.go
          GOARCH=amd64 go build -o rcc-ui-amd64 main.go
          lipo -create -output rcc-ui rcc-ui-arm64 rcc-ui-amd64
          cd ..
          cp ui/rcc-ui bin/rcc-ui

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # The tag is the only version the formula and the release notes ever
          # see. If VERSION disagrees, the tap ends up pointing at a version the
          # source never claims, and the tag is already public by then. Fail here
          # instead, while the only cost is a deleted tag.
          if [[ "${TAG#v}" != "$(cat VERSION)" ]]; then
            echo "ERROR: tag $TAG disagrees with VERSION $(cat VERSION)"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Release notes from the CHANGELOG
        run: |
          # The notes are the CHANGELOG section for this version, not a list of
          # commit subjects: 0.17.0 was 42 commits, and a reader wants what
          # changed rather than how it was typed. The extraction lives in
          # tools/changelog-section.sh so that release-preflight.yml previews
          # these exact notes with this exact code.
          #
          # It fails when the section is missing, and it fails here: at this
          # point the tag is public but nothing else is, so a deleted tag is
          # the whole cost.
          ./tools/changelog-section.sh "${{ steps.version.outputs.version }}" \
            > /tmp/release-notes.md
          echo "Release notes: $(wc -l < /tmp/release-notes.md) lines from CHANGELOG.md"

      - name: The tap must be writable, and hold the formula, before publishing
        env:
          GH_TOKEN: ${{ secrets.RACCOONTAPPUSH }}
        run: |
          # Everything the last step needs, checked while the only cost is a
          # deleted tag. It used to be checked at the end, after the release was
          # public: a tap that had moved, or a token that had lost its scope,
          # produced a published release with a formula still on the old
          # version and nothing saying so.
          if [ -z "${GH_TOKEN}" ]; then
            echo "ERROR: tap token is empty (secret RACCOONTAPPUSH not set?)" >&2
            exit 1
          fi

          # The tap is public: a token with no write access clones it happily
          # and only fails at push. Ask GitHub instead of finding out then.
          push=$(gh api "repos/${TAP_REPO}" --jq '.permissions.push')
          if [ "$push" != "true" ]; then
            echo "ERROR: RACCOONTAPPUSH cannot push to ${TAP_REPO} (permissions.push=$push)" >&2
            echo "Grant the fine-grained PAT Contents:write on ${TAP_REPO}." >&2
            exit 1
          fi

          # rcc moved from thousandflowers/homebrew-raccoon to the shared tap.
          # A tag cut from a commit older than that move runs THAT commit's
          # workflow, which points at the old tap where the formula no longer
          # exists — so name the miss here rather than after publishing.
          if ! gh api "repos/${TAP_REPO}/contents/${FORMULA_PATH}" --jq '.name' >/dev/null 2>&1; then
            echo "ERROR: ${FORMULA_PATH} is not in ${TAP_REPO}" >&2
            echo "Tag from an up-to-date main: rcc is in thousandflowers/homebrew-tap now." >&2
            exit 1
          fi

      - name: Build standalone single-file rcc
        run: |
          ./tools/build-standalone.sh dist/rcc
          # Smoke-test the artifact runs with no repo on disk.
          RCC_BUNDLE_CACHE="$(mktemp -d)" dist/rcc audit --list-checks >/dev/null

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            bin/rcc-ui \
            dist/rcc \
          || gh release upload "$TAG" bin/rcc-ui dist/rcc --clobber

      - name: Compute tarball SHA256
        id: sha
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.RACCOONTAPPUSH }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ env.TAP_REPO }}.git" tap-repo
          cd tap-repo
          FORMULA="${{ env.FORMULA_PATH }}"

          # rcc.rb carries no `version` field: brew reads the version out of the
          # tag in the url. There used to be a sed for it here, matching nothing
          # on every release — a rewrite that silently does nothing looks
          # exactly like one that worked.
          sed -i '' 's|/archive/refs/tags/v[^"]*\.tar\.gz|/archive/refs/tags/'"$TAG"'\.tar\.gz|' "$FORMULA"
          sed -i '' 's/sha256 "[^"]*"/sha256 "'"$SHA256"'"/' "$FORMULA"

          # The seds are pattern matches against a file this repo does not own.
          # If the formula is ever reshaped they stop matching, and the tap
          # would be committed unchanged and called a successful release.
          grep -q "/archive/refs/tags/${TAG}\.tar\.gz" "$FORMULA" || {
            echo "ERROR: $FORMULA still does not point at $TAG after rewriting" >&2
            exit 1
          }
          grep -q "sha256 \"${SHA256}\"" "$FORMULA" || {
            echo "ERROR: $FORMULA did not take the new sha256" >&2
            exit 1
          }

          git add "$FORMULA"
          git -c user.name="Raccoon Release Bot" \
             -c user.email="actions@github.com" \
             commit -m "rcc ${TAG}"

          # The tap is shared with canary, skillreaper and qr-multi-imgs now, so
          # another project releasing in the same minute can take the push slot.
          # Rebase and try again instead of failing a release that is already
          # public over a race that resolves itself.
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "ERROR: could not push the formula after $n attempts" >&2
              exit 1
            fi
            echo "push rejected — someone else bumped the shared tap; rebasing (attempt $n)"
            git pull --rebase origin main
          done

  tap-token-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Can the tap token push to the tap?
        env:
          GH_TOKEN: ${{ secrets.RACCOONTAPPUSH }}
          TAP_REPO: thousandflowers/homebrew-tap
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "RACCOONTAPPUSH is not set" >&2
            exit 1
          fi
          push=$(gh api "repos/${TAP_REPO}" --jq '.permissions.push')
          echo "permissions.push on ${TAP_REPO} = ${push}"
          if [ "$push" != "true" ]; then
            echo "The token cannot push there. Grant it Contents:write on ${TAP_REPO}." >&2
            exit 1
          fi
          echo "OK - releases can bump ${TAP_REPO}."
