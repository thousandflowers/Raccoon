name: Release

on:
  push:
    tags: ["v*"]

env:
  TAP_REPO: thousandflowers/homebrew-raccoon
  FORMULA_PATH: Formula/rcc.rb

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Run shellcheck
        run: |
          shellcheck -S warning -x \
            rcc install.sh \
            lib/core/common.sh lib/core/commands.sh \
            lib/audit/checks.sh \
            bin/*.sh completions/bash/rcc
      - name: Install bats
        run: brew install bats-core
      - name: Run bats tests
        run: bats tests/

  release:
    needs: ci
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: ui/go.mod

      - name: Build universal Go TUI binary
        run: |
          cd ui
          GOARCH=arm64 go build -o rcc-ui-arm64 main.go
          GOARCH=amd64 go build -o rcc-ui-amd64 main.go
          lipo -create -output rcc-ui rcc-ui-arm64 rcc-ui-amd64
          cd ..
          cp ui/rcc-ui bin/rcc-ui

      - name: Get version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # The tag is the only version the formula and the release notes ever
          # see. If VERSION disagrees, the tap ends up pointing at a version the
          # source never claims, and the tag is already public by then. Fail here
          # instead, while the only cost is a deleted tag.
          if [[ "${TAG#v}" != "$(cat VERSION)" ]]; then
            echo "ERROR: tag $TAG disagrees with VERSION $(cat VERSION)"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Release notes from the CHANGELOG
        run: |
          # The notes are the CHANGELOG section for this exact version, not a
          # list of commit subjects: 0.17.0 was 42 commits, and a reader wants
          # what changed rather than how it was typed. Nothing here names a
          # version, so no future release has to edit this step.
          #
          # The heading is matched as a literal prefix rather than a regex,
          # because a version is full of dots and "0.17.0" as a pattern also
          # matches "0917.0". The section runs to the next "## " heading.
          VERSION="${{ steps.version.outputs.version }}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > /tmp/section.md

          # Trim the blank lines the split leaves at both ends.
          awk 'NF { p = 1 } p' /tmp/section.md |
            awk '{ a[NR] = $0 } END { n = NR
                   while (n > 0 && a[n] == "") n--
                   for (i = 1; i <= n; i++) print a[i] }' > /tmp/release-notes.md

          # Fail before the release exists rather than publish empty notes: at
          # this point the tag is public but nothing else is, and a deleted tag
          # is the whole cost.
          if [[ ! -s /tmp/release-notes.md ]]; then
            echo "ERROR: CHANGELOG.md has no '## [$VERSION]' section"
            echo "Sections found:"
            grep '^## ' CHANGELOG.md || true
            exit 1
          fi
          echo "Release notes: $(wc -l < /tmp/release-notes.md) lines from CHANGELOG.md"

      - name: Build standalone single-file rcc
        run: |
          ./tools/build-standalone.sh dist/rcc
          # Smoke-test the artifact runs with no repo on disk.
          RCC_BUNDLE_CACHE="$(mktemp -d)" dist/rcc audit --list-checks >/dev/null

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/release-notes.md \
            bin/rcc-ui \
            dist/rcc \
          || gh release upload "$TAG" bin/rcc-ui dist/rcc --clobber

      - name: Compute tarball SHA256
        id: sha
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$TARBALL_URL" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.RACCOONTAPPUSH }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "ERROR: tap token is empty (secret RACCOONTAPPUSH not set?)"
            exit 1
          fi

          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ env.TAP_REPO }}.git" tap-repo
          cd tap-repo

          FORMULA="${{ env.FORMULA_PATH }}"
          if [[ ! -f "$FORMULA" ]]; then
            echo "ERROR: $FORMULA not found in tap repo!"
            exit 1
          fi

          sed -i '' 's/version "[^"]*"/version "'"$VERSION"'"/' "$FORMULA"
          sed -i '' 's|/archive/refs/tags/v[^"]*\.tar\.gz|/archive/refs/tags/'"$TAG"'\.tar\.gz|' "$FORMULA"
          sed -i '' 's/sha256 "[^"]*"/sha256 "'"$SHA256"'"/' "$FORMULA"

          git add "$FORMULA"
          git -c user.name="Raccoon Release Bot" \
             -c user.email="actions@github.com" \
             commit -m "rcc ${TAG}"
          git push
